<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weather Dashboard</title>
<style>
  *, *::before, *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    background: #1a1a2e;
    color: #e0e0e0;
    min-height: 100vh;
    overflow-x: hidden;
    transition: background 0.5s ease, color 0.3s ease;
  }

  body.light {
    background: #e8edf2;
    color: #1a1a2e;
  }

  .container {
    max-width: 380px;
    margin: 0 auto;
    padding: 16px;
  }

  /* Empty state */
  .empty-state {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 60vh;
    text-align: center;
    opacity: 1;
    transition: opacity 0.4s ease;
  }

  .empty-state.hidden {
    display: none;
  }

  .empty-state .icon {
    font-size: 64px;
    margin-bottom: 16px;
    animation: float 3s ease-in-out infinite;
  }

  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
  }

  .empty-state h2 {
    font-size: 18px;
    font-weight: 600;
    margin-bottom: 8px;
    color: #a0a8c0;
  }

  body.light .empty-state h2 {
    color: #555;
  }

  .empty-state p {
    font-size: 14px;
    color: #6a7090;
    line-height: 1.5;
  }

  body.light .empty-state p {
    color: #777;
  }

  /* Dashboard */
  .dashboard {
    display: none;
    opacity: 0;
    transition: opacity 0.5s ease;
  }

  .dashboard.visible {
    display: block;
    opacity: 1;
  }

  /* City header */
  .city-header {
    text-align: center;
    margin-bottom: 4px;
  }

  .city-name {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: 0.5px;
  }

  .city-time {
    font-size: 12px;
    color: #8888aa;
    margin-top: 2px;
  }

  body.light .city-time {
    color: #888;
  }

  /* Hero weather */
  .hero {
    text-align: center;
    padding: 20px 0 16px;
  }

  .weather-icon {
    font-size: 72px;
    line-height: 1;
    display: block;
    margin-bottom: 8px;
    filter: drop-shadow(0 4px 12px rgba(0,0,0,0.3));
  }

  .temperature {
    font-size: 56px;
    font-weight: 300;
    line-height: 1;
    margin-bottom: 4px;
  }

  .temperature .unit-secondary {
    font-size: 24px;
    color: #8888aa;
    font-weight: 400;
  }

  body.light .temperature .unit-secondary {
    color: #888;
  }

  .condition-text {
    font-size: 16px;
    color: #a0a8c0;
    font-weight: 500;
  }

  body.light .condition-text {
    color: #555;
  }

  /* Stats grid */
  .stats-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin: 20px 0;
  }

  .stat-card {
    background: rgba(255,255,255,0.06);
    border-radius: 12px;
    padding: 14px;
    text-align: center;
    transition: background 0.3s ease, transform 0.2s ease;
  }

  body.light .stat-card {
    background: rgba(0,0,0,0.05);
  }

  .stat-card:hover {
    transform: translateY(-2px);
    background: rgba(255,255,255,0.1);
  }

  body.light .stat-card:hover {
    background: rgba(0,0,0,0.08);
  }

  .stat-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: #6a7090;
    margin-bottom: 6px;
  }

  body.light .stat-label {
    color: #888;
  }

  .stat-value {
    font-size: 20px;
    font-weight: 600;
  }

  .stat-icon {
    font-size: 16px;
    margin-right: 4px;
  }

  /* Forecast section */
  .forecast-section {
    margin-top: 24px;
  }

  .forecast-title {
    font-size: 14px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: #6a7090;
    margin-bottom: 12px;
  }

  body.light .forecast-title {
    color: #888;
  }

  .forecast-scroll {
    display: flex;
    gap: 10px;
    overflow-x: auto;
    padding-bottom: 8px;
    scrollbar-width: thin;
    scrollbar-color: rgba(255,255,255,0.15) transparent;
  }

  body.light .forecast-scroll {
    scrollbar-color: rgba(0,0,0,0.15) transparent;
  }

  .forecast-scroll::-webkit-scrollbar {
    height: 4px;
  }

  .forecast-scroll::-webkit-scrollbar-track {
    background: transparent;
  }

  .forecast-scroll::-webkit-scrollbar-thumb {
    background: rgba(255,255,255,0.15);
    border-radius: 2px;
  }

  body.light .forecast-scroll::-webkit-scrollbar-thumb {
    background: rgba(0,0,0,0.15);
  }

  .forecast-card {
    flex: 0 0 auto;
    width: 80px;
    background: rgba(255,255,255,0.06);
    border-radius: 12px;
    padding: 12px 8px;
    text-align: center;
    transition: background 0.3s ease, transform 0.2s ease;
  }

  body.light .forecast-card {
    background: rgba(0,0,0,0.05);
  }

  .forecast-card:hover {
    transform: translateY(-2px);
    background: rgba(255,255,255,0.1);
  }

  body.light .forecast-card:hover {
    background: rgba(0,0,0,0.08);
  }

  .forecast-day {
    font-size: 12px;
    font-weight: 600;
    color: #a0a8c0;
    margin-bottom: 6px;
  }

  body.light .forecast-day {
    color: #555;
  }

  .forecast-icon {
    font-size: 28px;
    display: block;
    margin-bottom: 6px;
  }

  .forecast-temp {
    font-size: 14px;
    font-weight: 600;
  }

  .forecast-temp-low {
    font-size: 11px;
    color: #6a7090;
  }

  body.light .forecast-temp-low {
    color: #999;
  }

  /* Section divider */
  .divider {
    height: 1px;
    background: rgba(255,255,255,0.08);
    margin: 20px 0;
  }

  body.light .divider {
    background: rgba(0,0,0,0.08);
  }

  /* Loading */
  .loading {
    display: none;
    text-align: center;
    padding: 40px 0;
  }

  .loading.active {
    display: block;
  }

  .spinner {
    width: 32px;
    height: 32px;
    border: 3px solid rgba(255,255,255,0.15);
    border-top-color: #6c8cff;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin: 0 auto 12px;
  }

  body.light .spinner {
    border-color: rgba(0,0,0,0.1);
    border-top-color: #4a6cf7;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  /* Fade-in animation */
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .fade-in {
    animation: fadeIn 0.4s ease forwards;
  }
</style>
</head>
<body>
<div class="container">

  <div id="emptyState" class="empty-state">
    <span class="icon">🌤️</span>
    <h2>Weather Dashboard</h2>
    <p>Ask me about the weather in any city!</p>
  </div>

  <div id="loading" class="loading">
    <div class="spinner"></div>
    <p>Fetching weather data...</p>
  </div>

  <div id="dashboard" class="dashboard">
    <div class="city-header fade-in">
      <div id="cityName" class="city-name"></div>
      <div id="cityTime" class="city-time"></div>
    </div>

    <div class="hero fade-in">
      <span id="weatherIcon" class="weather-icon"></span>
      <div id="temperature" class="temperature"></div>
      <div id="conditionText" class="condition-text"></div>
    </div>

    <div class="stats-grid">
      <div class="stat-card fade-in">
        <div class="stat-label">Feels Like</div>
        <div class="stat-value"><span class="stat-icon">🌡️</span><span id="feelsLike"></span></div>
      </div>
      <div class="stat-card fade-in">
        <div class="stat-label">Humidity</div>
        <div class="stat-value"><span class="stat-icon">💧</span><span id="humidity"></span></div>
      </div>
      <div class="stat-card fade-in">
        <div class="stat-label">Wind Speed</div>
        <div class="stat-value"><span class="stat-icon">💨</span><span id="windSpeed"></span></div>
      </div>
      <div class="stat-card fade-in">
        <div class="stat-label">Pressure</div>
        <div class="stat-value"><span class="stat-icon">🔽</span><span id="pressure"></span></div>
      </div>
    </div>

    <div id="forecastSection" class="forecast-section" style="display:none;">
      <div class="divider"></div>
      <div class="forecast-title">Forecast</div>
      <div id="forecastScroll" class="forecast-scroll"></div>
    </div>
  </div>

</div>

<script>
(function() {
  'use strict';

  // ---- Mock data ----
  var mockWeather = {
    'new york': { temp: 72, feels_like: 70, humidity: 55, wind_speed: 12, pressure: 1015, condition: 'Partly Cloudy', icon: '\u26C5' },
    'london':   { temp: 58, feels_like: 55, humidity: 78, wind_speed: 15, pressure: 1008, condition: 'Overcast', icon: '\u2601\uFE0F' },
    'tokyo':    { temp: 68, feels_like: 66, humidity: 62, wind_speed: 8,  pressure: 1018, condition: 'Clear', icon: '\u2600\uFE0F' },
    'paris':    { temp: 63, feels_like: 60, humidity: 70, wind_speed: 10, pressure: 1012, condition: 'Light Rain', icon: '\uD83C\uDF27\uFE0F' },
    'sydney':   { temp: 77, feels_like: 79, humidity: 48, wind_speed: 14, pressure: 1020, condition: 'Sunny', icon: '\u2600\uFE0F' },
    'berlin':   { temp: 55, feels_like: 52, humidity: 72, wind_speed: 11, pressure: 1010, condition: 'Cloudy', icon: '\u2601\uFE0F' },
    'mumbai':   { temp: 88, feels_like: 93, humidity: 80, wind_speed: 6,  pressure: 1006, condition: 'Humid & Hazy', icon: '\uD83C\uDF2B\uFE0F' },
    'toronto':  { temp: 50, feels_like: 46, humidity: 60, wind_speed: 18, pressure: 1014, condition: 'Windy', icon: '\uD83C\uDF43' },
    'dubai':    { temp: 95, feels_like: 100, humidity: 35, wind_speed: 7, pressure: 1011, condition: 'Hot & Sunny', icon: '\u2600\uFE0F' },
    'moscow':   { temp: 38, feels_like: 32, humidity: 82, wind_speed: 13, pressure: 1022, condition: 'Snow', icon: '\u2744\uFE0F' }
  };

  var conditionVariants = [
    { condition: 'Partly Cloudy', icon: '\u26C5' },
    { condition: 'Clear', icon: '\u2600\uFE0F' },
    { condition: 'Light Rain', icon: '\uD83C\uDF27\uFE0F' },
    { condition: 'Overcast', icon: '\u2601\uFE0F' },
    { condition: 'Sunny', icon: '\uD83C\uDF24\uFE0F' },
    { condition: 'Showers', icon: '\uD83C\uDF26\uFE0F' },
    { condition: 'Thunderstorm', icon: '\u26C8\uFE0F' },
    { condition: 'Snow', icon: '\u2744\uFE0F' }
  ];

  function fToC(f) {
    return Math.round((f - 32) * 5 / 9);
  }

  function getDefaultWeather(cityName) {
    // Generate plausible weather for unknown cities
    var hash = 0;
    for (var i = 0; i < cityName.length; i++) {
      hash = ((hash << 5) - hash) + cityName.charCodeAt(i);
      hash |= 0;
    }
    var temp = 45 + Math.abs(hash % 50);
    var variant = conditionVariants[Math.abs(hash) % conditionVariants.length];
    return {
      temp: temp,
      feels_like: temp + (Math.abs(hash >> 4) % 7) - 3,
      humidity: 30 + Math.abs(hash >> 2) % 60,
      wind_speed: 3 + Math.abs(hash >> 3) % 20,
      pressure: 1000 + Math.abs(hash >> 5) % 30,
      condition: variant.condition,
      icon: variant.icon
    };
  }

  function getMockWeather(city) {
    var key = city.toLowerCase().trim();
    if (mockWeather[key]) {
      return Object.assign({}, mockWeather[key], { city: city });
    }
    var data = getDefaultWeather(key);
    data.city = city;
    return data;
  }

  function getMockForecast(city, days) {
    days = Math.min(Math.max(days || 5, 1), 5);
    var current = getMockWeather(city);
    var forecast = [];
    var dayNames = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
    var today = new Date();

    for (var i = 0; i < days; i++) {
      var d = new Date(today);
      d.setDate(d.getDate() + i + 1);
      var variation = Math.round((Math.random() - 0.5) * 12);
      var highTemp = current.temp + variation + Math.round(Math.random() * 5);
      var lowTemp = highTemp - 8 - Math.round(Math.random() * 8);
      var variant = conditionVariants[Math.floor(Math.random() * conditionVariants.length)];
      forecast.push({
        day: dayNames[d.getDay()],
        date: (d.getMonth() + 1) + '/' + d.getDate(),
        high: highTemp,
        low: lowTemp,
        condition: variant.condition,
        icon: variant.icon,
        humidity: 30 + Math.floor(Math.random() * 50),
        wind_speed: 3 + Math.floor(Math.random() * 18)
      });
    }
    return { city: city, forecast: forecast };
  }

  // ---- DOM references ----
  var emptyState = document.getElementById('emptyState');
  var loading = document.getElementById('loading');
  var dashboard = document.getElementById('dashboard');
  var cityNameEl = document.getElementById('cityName');
  var cityTimeEl = document.getElementById('cityTime');
  var weatherIconEl = document.getElementById('weatherIcon');
  var temperatureEl = document.getElementById('temperature');
  var conditionTextEl = document.getElementById('conditionText');
  var feelsLikeEl = document.getElementById('feelsLike');
  var humidityEl = document.getElementById('humidity');
  var windSpeedEl = document.getElementById('windSpeed');
  var pressureEl = document.getElementById('pressure');
  var forecastSection = document.getElementById('forecastSection');
  var forecastScroll = document.getElementById('forecastScroll');

  var currentState = {};

  // ---- UI update functions ----
  function showLoading() {
    emptyState.classList.add('hidden');
    loading.classList.add('active');
  }

  function hideLoading() {
    loading.classList.remove('active');
  }

  function showDashboard() {
    hideLoading();
    emptyState.classList.add('hidden');
    dashboard.classList.add('visible');
  }

  function capitalize(str) {
    return str.replace(/\b\w/g, function(l) { return l.toUpperCase(); });
  }

  function updateCurrentWeather(data) {
    showDashboard();
    cityNameEl.textContent = capitalize(data.city);
    cityTimeEl.textContent = new Date().toLocaleString('en-US', {
      weekday: 'short', hour: 'numeric', minute: '2-digit', hour12: true
    });
    weatherIconEl.textContent = data.icon;
    temperatureEl.innerHTML = data.temp + '\u00B0F <span class="unit-secondary">(' + fToC(data.temp) + '\u00B0C)</span>';
    conditionTextEl.textContent = data.condition;
    feelsLikeEl.textContent = data.feels_like + '\u00B0F';
    humidityEl.textContent = data.humidity + '%';
    windSpeedEl.textContent = data.wind_speed + ' mph';
    pressureEl.textContent = data.pressure + ' hPa';

    currentState = {
      city: data.city,
      temp: data.temp,
      condition: data.condition,
      humidity: data.humidity,
      wind_speed: data.wind_speed
    };
  }

  function updateForecast(data) {
    showDashboard();
    cityNameEl.textContent = capitalize(data.city);
    cityTimeEl.textContent = new Date().toLocaleString('en-US', {
      weekday: 'short', hour: 'numeric', minute: '2-digit', hour12: true
    });

    forecastScroll.innerHTML = '';
    if (data.forecast && data.forecast.length > 0) {
      forecastSection.style.display = 'block';
      data.forecast.forEach(function(day) {
        var card = document.createElement('div');
        card.className = 'forecast-card fade-in';
        card.innerHTML =
          '<div class="forecast-day">' + day.day + '<br><small>' + day.date + '</small></div>' +
          '<span class="forecast-icon">' + day.icon + '</span>' +
          '<div class="forecast-temp">' + day.high + '\u00B0' + '</div>' +
          '<div class="forecast-temp-low">' + day.low + '\u00B0</div>';
        forecastScroll.appendChild(card);
      });
    }

    currentState.forecast = data.forecast;
  }

  // ---- Bridge communication ----
  function generateId() {
    if (typeof crypto !== 'undefined' && crypto.randomUUID) {
      return crypto.randomUUID();
    }
    return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
      var r = (Math.random() * 16) | 0;
      var v = c === 'x' ? r : (r & 0x3) | 0x8;
      return v.toString(16);
    });
  }

  function sendToHost(type, payload, id) {
    window.parent.postMessage({
      type: type,
      id: id || generateId(),
      payload: payload || {},
      timestamp: Date.now()
    }, '*');
  }

  function handleToolCall(id, payload) {
    // Bridge sends {toolName, args}; also support legacy {name, parameters}
    var toolName = payload.toolName || payload.name;
    var params = payload.args || payload.parameters || {};

    if (toolName === 'get_weather') {
      showLoading();
      var city = params.city || 'New York';

      // Small delay to show loading state
      setTimeout(function() {
        var weatherData = getMockWeather(city);
        updateCurrentWeather(weatherData);

        var resultText = capitalize(city) + ': ' + weatherData.temp + '\u00B0F (' + fToC(weatherData.temp) + '\u00B0C), ' +
          weatherData.condition + '. Humidity: ' + weatherData.humidity + '%, Wind: ' + weatherData.wind_speed + ' mph.';

        sendToHost('tool_call_result', { result: resultText }, id);
        sendToHost('state_update', currentState);
      }, 300);

    } else if (toolName === 'get_forecast') {
      showLoading();
      var forecastCity = params.city || 'New York';
      var days = params.days || 5;

      setTimeout(function() {
        // Also show current weather when fetching forecast
        var weatherData = getMockWeather(forecastCity);
        updateCurrentWeather(weatherData);

        var forecastData = getMockForecast(forecastCity, days);
        updateForecast(forecastData);

        var forecastLines = forecastData.forecast.map(function(d) {
          return d.day + ' ' + d.date + ': ' + d.icon + ' ' + d.high + '\u00B0F/' + d.low + '\u00B0F ' + d.condition;
        });
        var resultText = days + '-day forecast for ' + capitalize(forecastCity) + ':\n' + forecastLines.join('\n');

        sendToHost('tool_call_result', { result: resultText }, id);
        sendToHost('state_update', currentState);
      }, 400);

    } else {
      sendToHost('tool_call_result', { result: 'Unknown tool: ' + toolName }, id);
    }
  }

  window.addEventListener('message', function(event) {
    var data = event.data;
    if (!data || typeof data !== 'object' || !data.type) return;

    switch (data.type) {
      case 'app_init':
        // Check for theme preference in init payload
        if (data.payload && data.payload.theme === 'light') {
          document.body.classList.add('light');
        }
        sendToHost('ready', {}, data.id);
        break;

      case 'tool_call':
        handleToolCall(data.id, data.payload || {});
        break;

      case 'ping':
        sendToHost('pong', {}, data.id);
        break;
    }
  });

  // Signal ready on load (in case host already sent init before listener was attached)
  sendToHost('ready', {});

})();
</script>
</body>
</html>
